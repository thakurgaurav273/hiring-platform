version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: grovyn_postgres
    restart: always
    environment:
      POSTGRES_USER: grovyn_user
      POSTGRES_PASSWORD: grovyn_password
      POSTGRES_DB: grovyn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grovyn_user -d grovyn_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: grovyn_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://grovyn_user:grovyn_password@db:5432/grovyn_db?schema=public
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-generate_a_secure_secret_in_prod}
      # Add any other required production env variables here
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: grovyn_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://your-production-api-domain.com/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
